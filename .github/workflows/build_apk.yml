name: Build Pygame Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          libexpat1-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          ffmpeg \
          patch \
          lld

    - name: Install Buildozer & Compatible Tools
      run: |
        python -m pip install --upgrade pip "setuptools<70.0.0" wheel
        python -m pip install "cython==0.29.36" buildozer appdirs "colorama>=0.3.3" jinja2 "sh>=1.10,<2.0" build toml packaging

    - name: Prepare Environment, Fix longintrepr.h, and Build APK
      run: |
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK_LATEST_HOME
        unset CFLAGS
        unset CPPFLAGS

        # مراقب تلقائي ينسخ longintrepr.h ويصلح تعارض دوال SDL2 في Pygame فور فك ضغط الملفات أثناء البناء
        (
          while true; do
            for inc_dir in .buildozer/android/platform/build-*/build/other_builds/python3/*/python3/Include .buildozer/android/platform/build-*/build/other_builds/hostpython3/desktop/hostpython3/Include .buildozer/android/platform/build-*/build/python-installs/*/*/include/python*; do
              if [ -d "$inc_dir/cpython" ] && [ -f "$inc_dir/cpython/longintrepr.h" ] && [ ! -f "$inc_dir/longintrepr.h" ]; then
                cp "$inc_dir/cpython/longintrepr.h" "$inc_dir/longintrepr.h"
                echo "[FIX APPLIED] Copied longintrepr.h into $inc_dir"
              fi
            done
            sleep 1
          done
        ) &
        WATCHER_PID=$!

        set +e
        yes | buildozer android debug 2>&1 | tee buildozer_full.log
        set -e

        kill $WATCHER_PID 2>/dev/null || true

        if [ ! -d "bin" ] || [ -z "$(find bin -maxdepth 1 -name '*.apk' -print -quit)" ]; then
          echo "==================== LAST 150 LINES OF BUILD LOG ===================="
          tail -n 150 buildozer_full.log
          echo "====================================================================="
          exit 1
        fi

        ls -lh bin/*.apk

    - name: Upload Build Log (If Failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-error-log
        path: buildozer_full.log

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SEF-Adventurer-APK
        path: bin/*.apk