name: Build SEF Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    # --------------------------------------
    # Checkout
    # --------------------------------------

    - name: Checkout Repository
      uses: actions/checkout@v4

    # --------------------------------------
    # Java
    # --------------------------------------

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # --------------------------------------
    # Python 3.10.12
    # --------------------------------------

    - name: Set up Python 3.10.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'

    - name: Verify Python
      run: |
        python --version
        python -c "import sys; print(sys.version)"

    # --------------------------------------
    # System dependencies
    # --------------------------------------

    - name: Install System Dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          libexpat1-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          ffmpeg \
          patch \
          lld

    # --------------------------------------
    # Buildozer tools
    # --------------------------------------

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade \
          pip \
          "setuptools<70.0.0" \
          wheel

        python -m pip install \
          "cython==0.29.36" \
          buildozer \
          appdirs \
          "colorama>=0.3.3" \
          jinja2 \
          "sh>=1.10,<2.0" \
          build \
          toml \
          packaging

    # --------------------------------------
    # Verify configuration
    # --------------------------------------

    - name: Verify Build Configuration
      run: |
        echo "===== buildozer.spec ====="
        cat buildozer.spec

        echo "===== Python requirements ====="
        grep "^requirements" buildozer.spec

        echo "===== P4A branch ====="
        grep "^p4a.branch" buildozer.spec

    # --------------------------------------
    # Build APK
    # --------------------------------------

    - name: Build Android APK
      run: |
        set +e

        yes | buildozer android debug > buildozer_full.log 2>&1

        build_status=${PIPESTATUS[1]}

        set -e

        if [ "$build_status" -ne 0 ]; then
          echo "Buildozer returned an error."
        fi

        if [ ! -d "bin" ] || \
           [ -z "$(find bin -maxdepth 1 -name '*.apk' -print -quit)" ]; then

          echo "=========================================="
          echo "BUILD FAILED - IMPORTANT ERRORS"
          echo "=========================================="

          grep -i -C 5 -E \
            "fatal error:|error: command|Command failed|Exception|Traceback|FAILURE:" \
            buildozer_full.log | tail -n 150 || true

          echo "=========================================="
          echo "LAST 150 LOG LINES"
          echo "=========================================="

          tail -n 150 buildozer_full.log

          exit 1
        fi

        echo "APK Built Successfully!"

        ls -lh bin/*.apk

    # --------------------------------------
    # Upload log on failure
    # --------------------------------------

    - name: Upload Build Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: SEF-Build-Error-Log
        path: buildozer_full.log
        if-no-files-found: ignore

    # --------------------------------------
    # Upload APK
    # --------------------------------------

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SEF-Adventurer-APK
        path: bin/*.apk
        if-no-files-found: error