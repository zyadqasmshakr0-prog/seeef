name: Build Pygame Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          libexpat1-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          ffmpeg \
          patch \
          lld

    - name: Install Buildozer & Compatible Tools
      run: |
        python -m pip install --upgrade pip "setuptools<70.0.0" wheel
        python -m pip install "cython==0.29.36" buildozer appdirs "colorama>=0.3.3" jinja2 "sh>=1.10,<2.0" build toml packaging

    - name: Prepare Environment, Patch Pygame & Build APK
      run: |
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK_LATEST_HOME
        unset CFLAGS
        unset CPPFLAGS

        # تسريع Git ومنع انقطاع التحميل
        git config --global http.postBuffer 524288000
        git config --global fetch.parallel 8

        # مراقب خلفي ذكي:
        # 1. ينسخ longintrepr.h وملفات cpython إلى مجلد Include الرئيسي فور ظهورها
        # 2. يضيف رايات التسامح لمترجم NDK clang فقط (دون المساس بمترجم gcc الخاص بالنظام)
        (
          while true; do
            # إصلاح longintrepr.h في كل مسارات بايثون المحتملة
            for inc_dir in $(find .buildozer -type d -name "cpython" 2>/dev/null); do
              parent_inc="$(dirname "$inc_dir")"
              if [ -f "$inc_dir/longintrepr.h" ] && [ ! -f "$parent_inc/longintrepr.h" ]; then
                cp -f "$inc_dir/"*.h "$parent_inc/" 2>/dev/null || true
                echo "[WATCHER] Copied cpython headers to $parent_inc"
              fi
            done

            # تعديل مباشر لملف sdl2.c في pygame إذا تم فك ضغطه ليقرأ من cpython/longintrepr.h أو يتجاوز الخطأ
            for sdl_c in $(find .buildozer -name "sdl2.c" 2>/dev/null); do
              if grep -q '"longintrepr.h"' "$sdl_c" 2>/dev/null; then
                sed -i 's|#include "longintrepr.h"|#include "cpython/longintrepr.h"|g' "$sdl_c" 2>/dev/null || true
                echo "[WATCHER] Patched longintrepr.h path in $sdl_c"
              fi
            done

            sleep 1
          done
        ) &
        WATCHER_PID=$!

        set +e
        yes | buildozer android debug 2>&1 | tee buildozer_full.log
        set -e

        kill $WATCHER_PID 2>/dev/null || true

        if [ ! -d "bin" ] || [ -z "$(find bin -maxdepth 1 -name '*.apk' -print -quit)" ]; then
          echo "==================== LAST 150 LINES OF BUILD LOG ===================="
          tail -n 150 buildozer_full.log
          echo "====================================================================="
          exit 1
        fi

        ls -lh bin/*.apk

    - name: Upload Build Log (If Failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-error-log
        path: buildozer_full.log

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SEF-Adventurer-APK
        path: bin/*.apk