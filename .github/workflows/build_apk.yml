name: Build Pygame Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          libexpat1-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          ffmpeg \
          patch \
          lld

    - name: Install Buildozer & Compatible Python Tools
      run: |
        python -m pip install --upgrade pip "setuptools<70.0.0" wheel
        python -m pip install "cython==0.29.36" buildozer appdirs "colorama>=0.3.3" jinja2 "sh>=1.10,<2.0" build toml packaging

    - name: Pre-clone p4a & Patch Pygame Recipe Deterministically
      run: |
        mkdir -p .buildozer/android/platform
        git clone -b v2024.01.21 --single-branch https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android

        python3 - << 'EOF'
        recipe_path = ".buildozer/android/platform/python-for-android/pythonforandroid/recipes/pygame/__init__.py"
        with open(recipe_path, "r", encoding="utf-8") as f:
            content = f.read()

        patch_code = """
                # استرجاع مسارات cpython الداخلية لـ Python 3.11 وتمرير رايات التسامح لمترجم NDK Clang فقط
                cpython_inc = join(self.ctx.get_python_install_dir(arch.arch), "include", "python3.11", "cpython")
                host_cpython_inc = join(self.get_recipe("hostpython3", self.ctx).get_build_dir(arch.arch), "Include", "cpython")
                extra_flags = f" -I{cpython_inc} -I{host_cpython_inc} -Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-incompatible-pointer-types"
                env["CFLAGS"] = env.get("CFLAGS", "") + extra_flags
                env["CPPFLAGS"] = env.get("CPPFLAGS", "") + extra_flags
                return env
        """
        if "return env" in content:
            content = content.replace("        return env", patch_code.strip("\n"))
            with open(recipe_path, "w", encoding="utf-8") as f:
                f.write(content)
            print("Successfully patched pygame recipe!")
        else:
            raise RuntimeError("Could not find 'return env' in pygame recipe")
        EOF

    - name: Pre-accept Android SDK Licenses & Build APK
      run: |
        unset ANDROID_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROID_NDK
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK_LATEST_HOME
        unset CFLAGS
        unset CPPFLAGS

        # وضع ملفات قبول رخص أندرويد القياسية مسبقاً لمنع توقف sdkmanager أو انقطاع yes |
        mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
        printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
        printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license"

        set +e
        buildozer android debug > buildozer_full.log 2>&1
        BUILD_EXIT=$?
        set -e

        if [ ! -d "bin" ] || [ -z "$(find bin -maxdepth 1 -name '*.apk' -print -quit)" ]; then
          echo "==================== ACTUAL FATAL ERRORS ===================="
          grep -i -C 5 -E "fatal error:|error: command|Command failed|Exception|Traceback|FAILURE:" buildozer_full.log | tail -n 120 || true
          echo "==================== LAST 120 LINES OF LOG ===================="
          tail -n 120 buildozer_full.log
          echo "==============================================================="
          exit 1
        fi

        echo "APK Built Successfully!"
        ls -lh bin/*.apk

    - name: Upload Build Log (If Failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-error-log
        path: buildozer_full.log

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SEF-Adventurer-APK
        path: bin/*.apk