name: Build Pygame Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          libunwind-dev \
          zip \
          unzip \
          autoconf \
          automake \
          libtool \
          libtool-bin \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libncurses-dev \
          libtinfo6 \
          cmake \
          libffi-dev \
          libssl-dev \
          libsqlite3-dev \
          libbz2-dev \
          libreadline-dev \
          libexpat1-dev \
          patch
        # إنشاء رابط توافق في حال طلبت أدوات أندرويد libtinfo.so.5
        if [ -f /lib/x86_64-linux-gnu/libtinfo.so.6 ] && [ ! -f /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
          sudo ln -s /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
        fi

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip "setuptools<70.0.0" wheel
        pip install "cython<3.0" buildozer

    - name: Build APK with Buildozer
      run: |
        yes | buildozer android debug || true
        ls -la bin/
        test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SEF-Adventurer-APK
        path: bin/*.apk